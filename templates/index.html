<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raho SMC Bybit Trading Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-6">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="flex justify-between items-center bg-gray-800 p-4 rounded-xl border border-gray-700">
            <h1 class="text-2xl font-bold text-yellow-500">⚙️ SMC Bybit Trading Bot</h1>
            <span class="text-xs bg-green-500/20 text-green-400 px-3 py-1 rounded-full">Bybit API v5 Active</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Bot Sazlamalary Panel -->
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 space-y-4">
                <h2 class="text-lg font-semibold border-b border-gray-700 pb-2">Bot Sazlamalary</h2>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Symbol (Moneta ady)</label>
                    <input id="symbol" type="text" value="BTCUSDT" class="w-full bg-gray-900 border border-gray-700 rounded p-2 focus:border-yellow-500 outline-none uppercase" />
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Entry Timeframe</label>
                        <select id="entry_tf" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white">
                            <option value="5m">5m</option>
                            <option value="15m" selected>15m</option>
                            <option value="30m">30m</option>
                            <option value="1H">1H</option>
                            <option value="4H">4H</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">HTF Timeframe</label>
                        <select id="htf_tf" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white">
                            <option value="30m">30m</option>
                            <option value="1H" selected>1H</option>
                            <option value="4H">4H</option>
                            <option value="1D">1D</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Margin (USDT)</label>
                        <input id="margin" type="number" value="10" class="w-full bg-gray-900 border border-gray-700 rounded p-2" />
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Leverage</label>
                        <input id="leverage" type="number" value="10" class="w-full bg-gray-900 border border-gray-700 rounded p-2" />
                    </div>
                </div>

                <div class="flex items-center gap-2 pt-2">
                    <input id="auto_trade" type="checkbox" class="w-4 h-4 text-yellow-500 rounded bg-gray-900 border-gray-700" />
                    <label for="auto_trade" class="text-sm font-medium">Awtomat Sdelka Aç (Auto-Trade)</label>
                </div>

                <button onclick="runAnalysis()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-2 rounded transition">
                    Analiz Başlat / Tazale
                </button>
            </div>

            <!-- Analiz Netijeleri Panel -->
            <div class="md:col-span-2 bg-gray-800 p-5 rounded-xl border border-gray-700 space-y-4">
                <h2 class="text-lg font-semibold border-b border-gray-700 pb-2">🧠 Smart Money Concept Analysis</h2>
                
                <div id="analysis-output" class="space-y-3">
                    <p class="text-gray-400">Analiz netijelerini görmek üçin monetany girizip, başlaň...</p>
                </div>
            </div>

        </div>

        <!-- Açylan Sdelkalar Taryhy (SQLite Data) -->
        <div class="bg-gray-800 p-5 rounded-xl border border-gray-700">
            <h2 class="text-lg font-semibold border-b border-gray-700 pb-3 mb-4">📜 Açylan Sdelkalar Taryhy</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-400">
                    <thead class="bg-gray-900 text-gray-200">
                        <tr>
                            <th class="p-3">Symbol</th>
                            <th class="p-3">Side</th>
                            <th class="p-3">Entry Price</th>
                            <th class="p-3">SL</th>
                            <th class="p-3">TP</th>
                            <th class="p-3">Qty</th>
                            <th class="p-3">Status</th>
                            <th class="p-3">Wagty</th>
                        </tr>
                    </thead>
                    <tbody id="history-table">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        async function runAnalysis() {
            const output = document.getElementById("analysis-output");
            output.innerHTML = `<div class="text-yellow-500 font-semibold animate-pulse">Analiz geçirilýär, garaşyň...</div>`;

            const data = {
                symbol: document.getElementById("symbol").value,
                entry_tf: document.getElementById("entry_tf").value,
                htf_tf: document.getElementById("htf_tf").value,
                margin: document.getElementById("margin").value,
                leverage: document.getElementById("leverage").value,
                auto_trade: document.getElementById("auto_trade").checked
            };

            try {
                const res = await fetch("/api/analyze", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (result.status === "success") {
                    const a = result.analysis;
                    let signalColor = a.signal === "BUY" ? "text-green-400" : (a.signal === "SELL" ? "text-red-400" : "text-gray-400");
                    
                    output.innerHTML = `
                        <div class="grid grid-cols-2 gap-4 bg-gray-900 p-4 rounded-lg">
                            <div><span class="text-gray-500">Häzirki Baha:</span> <b class="text-white">${a.price}</b></div>
                            <div><span class="text-gray-500">HTF Trend:</span> <b class="${a.htf_trend === 'BULLISH' ? 'text-green-400' : 'text-red-400'}">${a.htf_trend}</b></div>
                            <div><span class="text-gray-500">FVG Görünüşi:</span> <b class="text-yellow-400">${a.fvg_type || 'Ýok'}</b></div>
                            <div><span class="text-gray-500">Signal:</span> <b class="${signalColor} text-xl">${a.signal}</b></div>
                        </div>
                        
                        <div class="bg-gray-900 p-4 rounded-lg space-y-1 text-sm">
                            <div><b>OB ZONA:</b> ${a.ob_zone ? `${a.ob_zone[0]} - ${a.ob_zone[1]}` : 'Tapylmady'}</div>
                            <div><b>FVG ZONA:</b> ${a.fvg_zone ? `${a.fvg_zone[0]} - ${a.fvg_zone[1]}` : 'Tapylmady'}</div>
                        </div>

                        ${result.trade_executed ? `<div class="p-3 bg-green-500/20 text-green-400 rounded">${result.trade_message}</div>` : ''}
                    `;
                    loadHistory();
                } else {
                    output.innerHTML = `<div class="text-red-500">${result.message}</div>`;
                }
            } catch (err) {
                output.innerHTML = `<div class="text-red-500">Ýalňyşlyk ýüze çykdy: ${err}</div>`;
            }
        }

        async function loadHistory() {
            const res = await fetch("/api/history");
            const data = await res.json();
            const table = document.getElementById("history-table");
            table.innerHTML = "";

            data.trades.forEach(t => {
                table.innerHTML += `
                    <tr class="border-b border-gray-800">
                        <td class="p-3 font-bold">${t.symbol}</td>
                        <td class="p-3 ${t.side === 'Buy' ? 'text-green-400' : 'text-red-400'}">${t.side}</td>
                        <td class="p-3">${t.entry_price}</td>
                        <td class="p-3 text-red-400">${t.sl}</td>
                        <td class="p-3 text-green-400">${t.tp}</td>
                        <td class="p-3">${t.qty}</td>
                        <td class="p-3"><span class="bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded text-xs">${t.status}</span></td>
                        <td class="p-3 text-xs">${t.timestamp}</td>
                    </tr>
                `;
            });
        }

        // On Load
        loadHistory();
    </script>
</body>
</html>
